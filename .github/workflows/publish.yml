name: build-and-publish
on:
  push:
    tags: ["v*.*.*"]          # git tag v1.0.0 && git push --tags
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - name: Build
        run: dotnet build Genkan.Shared.slnx -c Release
      - name: Pack and push (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet pack src/Genkan.Shared/Genkan.Shared.csproj -c Release -p:Version="$VERSION" -o out
          dotnet nuget push out/*.nupkg --skip-duplicate \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}"
